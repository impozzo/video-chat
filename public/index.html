<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Video Chat Room - Real-time video, audio, screen sharing, and chat."
    />

    <meta name="theme-color" content="#222222" />

    <title>Video Chat Room</title>

    <style>
      /* =========================================
         MOBILE-FIRST BASE STYLES
         ========================================= */

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
      }

      body {
        font-family: Arial, sans-serif;
        background: #222;
        color: white;
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
      }

      button,
      input {
        font-family: inherit;
      }

      button {
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* =========================================
         TOP BAR
         ========================================= */

      #topBar {
        width: 100%;
        min-height: 70px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
        padding: 10px 15px;
        background: #2b2b2b;
        border-bottom: 1px solid #444;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      #topBarLeft {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-width: 0;
      }

      #loginStatusText {
        font-size: 14px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #topBarCenter {
        text-align: center;
        min-width: 0;
      }

      #topBarCenter h1 {
        font-size: 24px;
        margin: 0 0 5px;
        white-space: nowrap;
      }

      #roomInfo {
        font-size: 14px;
        color: #ccc;
        white-space: nowrap;
      }

      #topBarRight {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      #authButtonSlot {
        width: 90px;
        display: flex;
        justify-content: stretch;
      }

      #topLoginButton,
      #logoutButton,
      #topCreateAccountButton {
        padding: 9px 13px;
        color: white;
        border: 1px solid #555;
        font-size: 14px;
        white-space: nowrap;
      }

      #topLoginButton {
        width: 100%;
        background: #444;
      }

      #logoutButton {
        width: 100%;
        margin: 0;
        background: #7a2222;
      }

      #topCreateAccountButton {
        background: #444;
      }

      #topLoginButton:hover,
      #topCreateAccountButton:hover {
        background: #555;
      }

      #logoutButton:hover {
        background: #922b2b;
      }

      #copyLinkButton {
        padding: 10px 14px;
        background: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 7px;
      }

      #copyLinkButton:hover {
        background: #444;
      }

      /* =========================================
         ACCOUNT / LOGIN
         ========================================= */

      #accountArea,
      #loginArea {
        width: calc(100% - 20px);
        max-width: 450px;
        margin: 15px auto;
        background: #333;
        border-radius: 10px;
        padding: 16px;
        text-align: center;
      }

      #accountArea h2,
      #loginArea h2 {
        margin-top: 0;
        font-size: 20px;
      }

      #registerUsernameInput,
      #registerPasswordInput,
      #loginUsernameInput,
      #loginPasswordInput {
        display: block;
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: none;
        border-radius: 6px;
        font-size: 16px;
      }

      #accountArea button,
      #loginArea button {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        background: #444;
        color: white;
        border: 1px solid #555;
        font-size: 15px;
      }

      #accountArea button:hover:not(:disabled),
      #loginArea button:hover:not(:disabled) {
        background: #555;
      }

      #registrationMessage,
      #loginMessage {
        min-height: 20px;
        margin-top: 10px;
        font-size: 14px;
      }

      /* =========================================
         ROOM LIST
         ========================================= */

      #roomSelection {
        width: calc(100% - 20px);
        max-width: 700px;
        margin: 20px auto;
        background: #333;
        border-radius: 10px;
        padding: 0;
        overflow: hidden;
      }

      #roomSelection h2 {
        margin: 0;
        padding: 14px 16px;
        font-size: 20px;
        text-align: left;
        background: #2b2b2b;
      }

      .room-header {
        display: grid;
        grid-template-columns: 1fr 80px;
        align-items: center;
        padding: 8px 12px;
        background: #222;
        border-bottom: 1px solid #444;
        color: #aaa;
        font-size: 13px;
        text-transform: uppercase;
      }

      .room-header-users {
        text-align: right;
      }

      #roomList {
        width: 100%;
      }

      .room-row {
        display: grid;
        grid-template-columns: 1fr 80px;
        align-items: center;
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        background: #333;
        color: white;
        text-decoration: none;
        border-bottom: 1px solid #444;
        cursor: pointer;
      }

      .room-row:last-child {
        border-bottom: none;
      }

      .room-row:hover {
        background: #444;
      }

      .room-row.current-room {
        background: #555;
      }

      .room-name {
        font-size: 15px;
        text-align: left;
      }

      .room-users {
        font-size: 14px;
        text-align: right;
        color: #ddd;
      }

      .room-full {
        font-size: 12px;
        color: #aaa;
        margin-left: 10px;
      }

      .room-instruction {
        padding: 8px 12px;
        color: #ff3333;
        background: #222;
        font-size: 14px;
        text-align: left;
        border-bottom: 1px solid #444;
      }

      /* =========================================
         PEOPLE
         ========================================= */

      #peopleBox {
        width: calc(100% - 20px);
        max-width: 450px;
        margin: 20px auto;
        background: #333;
        border-radius: 12px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      }

      #peopleBox h2 {
        margin: 0 0 12px;
        font-size: 19px;
      }

      #peopleList,
      #watchingList {
        background: #111;
        border-radius: 8px;
        padding: 6px;
        min-height: 40px;
        text-align: left;
        border: 1px solid #444;
      }

      #watchingTitle {
        margin-top: 20px !important;
      }

      .person {
        min-height: 46px;
        padding: 8px;
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .person:last-child {
        border-bottom: none;
      }

      .person-name {
        flex: 1;
        font-size: 15px;
        font-weight: bold;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .person-status {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }

      .status-icon {
        padding: 4px 6px;
        margin: 0;
        font-size: 16px;
        border-radius: 5px;
      }

      .camera-status {
        cursor: pointer;
        background: transparent;
      }

      .camera-status:hover:not(:disabled) {
        background: #333;
      }

      .camera-status.off {
        cursor: default;
        opacity: 0.4;
      }

      .mic-status {
        cursor: default;
        opacity: 0.8;
        background: transparent;
      }

      /* =========================================
         VIDEO GRID
         ========================================= */

      #videos {
        display: grid;
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 10px;
        padding: 10px;
        width: 100%;
        margin: 0 auto;
      }

      .video-container {
        position: relative;
        background: #111;
        border-radius: 10px;
        overflow: hidden;
        width: 100%;
        max-width: 500px;
        aspect-ratio: 16 / 9;
        margin: 0 auto;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
        border: 1px solid #444;
      }

      .video-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .username {
        position: absolute;
        bottom: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.75);
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 13px;
        z-index: 2;
      }

      /* =========================================
         REMOTE VIDEO CLOSE BUTTON
         ========================================= */

      .close-video-button {
        position: absolute;
        top: 7px;
        right: 7px;
        z-index: 10;
        width: 32px;
        height: 32px;
        padding: 0;
        margin: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        font-size: 18px;
        line-height: 32px;
        text-align: center;
      }

      .close-video-button:hover {
        background: rgba(180, 0, 0, 0.9);
      }

      /* =========================================
         CONTROLS
         ========================================= */

      #controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: calc(100% - 20px);
        max-width: 500px;
        padding: 10px;
        margin: 5px auto 20px;
      }

      #controls button {
        width: 100%;
        min-width: 0;
        padding: 12px 8px;
        margin: 0;
        border: 1px solid #555;
        border-radius: 8px;
        background: #333;
        color: white;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
      }

      #controls button:hover:not(:disabled) {
        background: #444;
      }

      /* =========================================
         CHAT
         ========================================= */

      #chat {
        width: calc(100% - 20px);
        max-width: 500px;
        margin: 20px auto;
        background: #333;
        border-radius: 12px;
        padding: 12px;
      }

      #chat h2 {
        margin-top: 0;
        text-align: center;
        font-size: 20px;
      }

      #messages {
        height: 250px;
        overflow-y: auto;
        background: #111;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .chat-message {
        max-width: 88%;
        padding: 8px 10px;
        border-radius: 10px;
        word-wrap: break-word;
      }

      .chat-message.other {
        align-self: flex-start;
        background: #444;
      }

      .chat-message.mine {
        align-self: flex-end;
        background: #555;
      }

      /* =========================================
         CHAT HEADER
         ========================================= */

      .message-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        opacity: 0.75;
        margin-bottom: 4px;
      }

      .message-username {
        font-weight: bold;
      }

      .message-time {
        font-size: 10px;
        opacity: 0.7;
        white-space: nowrap;
      }

      .message-text {
        font-size: 15px;
        line-height: 1.3;
      }

      #chatInputArea {
        display: flex;
        gap: 6px;
      }

      #messageInput {
        flex: 1;
        min-width: 0;
        padding: 11px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
      }

      #messageInput:focus {
        outline: 2px solid #777;
      }

      #sendButton {
        padding: 10px 14px;
        background: #444;
        color: white;
        border: 1px solid #555;
      }

      #sendButton:hover {
        background: #555;
      }

      /* =========================================
         TABLET
         ========================================= */

      @media (min-width: 600px) {
        #topBar {
          padding: 12px 20px;
        }

        #topBarCenter h1 {
          font-size: 28px;
        }

        #videos {
          grid-template-columns: repeat(auto-fit, minmax(300px, 500px));
          justify-content: center;
          gap: 15px;
          padding: 15px;
        }

        #controls {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-wrap: wrap;
          width: auto;
          max-width: 900px;
          gap: 8px;
          padding: 15px;
        }

        #controls button {
          width: auto;
          min-width: 130px;
          padding: 11px 16px;
        }
      }

      /* =========================================
         DESKTOP
         ========================================= */

      @media (min-width: 900px) {
        #accountArea,
        #loginArea {
          margin: 20px auto;
        }

        #videos {
          gap: 18px;
          padding: 20px;
          max-width: 1600px;
        }

        .video-container {
          max-width: 500px;
          border-radius: 12px;
        }

        .username {
          bottom: 10px;
          left: 10px;
          padding: 6px 10px;
          font-size: 14px;
        }

        #peopleBox {
          padding: 18px;
        }

        #chat {
          padding: 15px;
        }
      }

      /* =========================================
         SMALL SCREENS
         ========================================= */

      @media (max-width: 599px) {
        #topBar {
          grid-template-columns: 1fr;
          text-align: center;
          gap: 8px;
        }

        #topBarLeft {
          justify-content: center;
          order: 1;
        }

        #topBarCenter {
          order: 2;
        }

        #topBarRight {
          justify-content: center;
          order: 3;
        }

        #topBarCenter h1 {
          font-size: 22px;
        }

        #topBarRight {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================================
         TOP BAR
         ========================================= -->

    <div id="topBar">
      <div id="topBarLeft">
        <span id="loginStatusText">🔴 Not logged in</span>
      </div>

      <div id="topBarCenter">
        <h1>Video Chat Room</h1>
        <div id="roomInfo"></div>
      </div>

      <div id="topBarRight">
        <!-- Login and Logout occupy the SAME position -->
        <div id="authButtonSlot">
          <button id="topLoginButton">Login</button>

          <button id="logoutButton" style="display: none">Logout</button>
        </div>

        <button id="topCreateAccountButton">Create Account</button>
      </div>
    </div>

    <!-- =========================================
         COPY ROOM LINK
         ========================================= -->

    <div style="text-align: center; padding: 10px">
      <button id="copyLinkButton">🔗 Copy Room Link</button>
    </div>

    <!-- =========================================
         REGISTER
         ========================================= -->

    <div id="accountArea" style="display: none">
      <h2>Create Account</h2>

      <input
        id="registerUsernameInput"
        type="text"
        placeholder="Username"
        autocomplete="username"
      />

      <input
        id="registerPasswordInput"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
      />

      <button id="registerButton">Create Account</button>

      <div id="registrationMessage"></div>
    </div>

    <!-- =========================================
         LOGIN
         ========================================= -->

    <div id="loginArea" style="display: none">
      <h2>Login</h2>

      <input
        id="loginUsernameInput"
        type="text"
        placeholder="Username"
        autocomplete="username"
      />

      <input
        id="loginPasswordInput"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      />

      <button id="loginButton">Login</button>

      <div id="loginMessage"></div>
    </div>

    <!-- =========================================
         ROOM SELECTION
         ========================================= -->

    <div id="roomSelection">
      <h2>Choose a Room</h2>

      <div class="room-instruction">↓ Click a room to switch rooms</div>

      <div class="room-header">
        <div>Room Name</div>

        <div class="room-header-users">Users</div>
      </div>

      <div id="roomList">
        <a class="room-row" href="/room/general" data-room="general">
          <span class="room-name"> General </span>

          <span class="room-users"> 0 </span>
        </a>

        <a class="room-row" href="/room/gaming" data-room="gaming">
          <span class="room-name"> Gaming </span>

          <span class="room-users"> 0 </span>
        </a>

        <a class="room-row" href="/room/music" data-room="music">
          <span class="room-name"> Music </span>

          <span class="room-users"> 0 </span>
        </a>

        <a class="room-row" href="/room/movies" data-room="movies">
          <span class="room-name"> Movies </span>

          <span class="room-users"> 0 </span>
        </a>

        <a class="room-row" href="/room/sports" data-room="sports">
          <span class="room-name"> Sports </span>

          <span class="room-users"> 0 </span>
        </a>

        <a class="room-row" href="/room/technology" data-room="technology">
          <span class="room-name"> Technology </span>

          <span class="room-users"> 0 </span>
        </a>

        <a class="room-row" href="/room/random" data-room="random">
          <span class="room-name"> Random </span>

          <span class="room-users"> 0 </span>
        </a>
      </div>
    </div>

    <!-- =========================================
         PEOPLE
         ========================================= -->

    <div id="peopleBox">
      <h2 id="peopleTitle">People in Room (0)</h2>

      <div id="peopleList"></div>

      <h2 id="watchingTitle">Watching My Camera (0)</h2>

      <div id="watchingList"></div>
    </div>

    <!-- =========================================
         VIDEOS
         ========================================= -->

    <div id="videos"></div>

    <!-- =========================================
         CONTROLS
         ========================================= -->

    <div id="controls">
      <button id="muteButton" disabled>🎤 Mic On</button>

      <button id="cameraButton" disabled>📹 Camera On</button>

      <button id="screenButton" disabled>🖥️ Share Screen</button>
    </div>

    <!-- =========================================
         CHAT
         ========================================= -->

    <div id="chat">
      <h2>💬 Chat</h2>

      <div id="messages"></div>

      <div id="chatInputArea">
        <input
          id="messageInput"
          placeholder="Type a message..."
          autocomplete="off"
        />

        <button id="sendButton">Send</button>
      </div>
    </div>

    <!-- =========================================
         CURRENT ROOM HIGHLIGHT
         ========================================= -->

      const pathParts = window.location.pathname.split("/").filter(Boolean);

      const currentRoom =

      document.querySelectorAll(".room-row").forEach((roomRow) => {
        if (roomRow.dataset.room === currentRoom) {
          roomRow.classList.add("current-room");
        }
      });
    </script> -->

    <script src="/socket.io/socket.io.js"></script>

    <script src="/app.js"></script>
  </body>
</html>
