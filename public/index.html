<!doctype html>
<html>
  <head>
    <title>Video Chat Room</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #222;
        color: white;
        margin: 0;
      }

      #top {
        text-align: center;
        padding: 20px;
      }

      #copyLinkButton {
        margin-top: 10px;
      }

      /* ACCOUNT */

      #accountArea {
        width: 400px;
        max-width: 90%;

        margin: 20px auto;

        background: #333;

        border-radius: 10px;

        padding: 20px;

        text-align: center;
      }

      #accountArea h2 {
        margin-top: 0;
      }

      #registerUsernameInput,
      #registerPasswordInput {
        display: block;

        width: 100%;

        padding: 10px;

        margin: 8px 0;

        border: none;

        border-radius: 6px;

        font-size: 14px;
      }

      #registrationMessage {
        min-height: 20px;

        margin-top: 10px;

        font-size: 14px;
      }

      /* LOGIN */

      #loginArea {
        width: 400px;
        max-width: 90%;

        margin: 20px auto;

        background: #333;

        border-radius: 10px;

        padding: 20px;

        text-align: center;
      }

      #loginArea h2 {
        margin-top: 0;
      }

      #loginUsernameInput,
      #loginPasswordInput {
        display: block;

        width: 100%;

        padding: 10px;

        margin: 8px 0;

        border: none;

        border-radius: 6px;

        font-size: 14px;
      }

      #loginMessage {
        min-height: 20px;

        margin-top: 10px;

        font-size: 14px;
      }

      /* VIDEO GRID */

      #videos {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(300px, 500px));

        justify-content: center;

        align-items: center;

        gap: 15px;

        padding: 15px;

        width: 100%;

        max-width: 1600px;

        margin: 0 auto;
      }

      .video-container {
        position: relative;

        background: black;

        border-radius: 10px;

        overflow: hidden;

        width: 100%;

        max-width: 500px;

        aspect-ratio: 16 / 9;

        margin: 0 auto;
      }

      .video-container video {
        width: 100%;

        height: 100%;

        object-fit: cover;

        display: block;
      }

      .username {
        position: absolute;

        bottom: 10px;

        left: 10px;

        background: rgba(0, 0, 0, 0.7);

        padding: 6px 10px;

        border-radius: 5px;
      }

      /* REMOTE VIDEO CLOSE BUTTON */

      .close-video-button {
        position: absolute;

        top: 8px;

        right: 8px;

        z-index: 10;

        width: 32px;

        height: 32px;

        padding: 0;

        margin: 0;

        border-radius: 50%;

        background: rgba(0, 0, 0, 0.75);

        color: white;

        font-size: 18px;

        line-height: 32px;

        text-align: center;
      }

      .close-video-button:hover {
        background: rgba(180, 0, 0, 0.9);
      }

      /* CONTROLS */

      #controls {
        text-align: center;

        padding: 10px;
      }

      button {
        padding: 10px 15px;

        margin: 4px;

        border: none;

        border-radius: 6px;

        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;

        cursor: not-allowed;
      }

      /* PEOPLE */

      #peopleBox {
        width: 400px;

        max-width: 90%;

        margin: 20px auto;

        background: #333;

        border-radius: 10px;

        padding: 15px;

        text-align: center;
      }

      #peopleBox h2 {
        margin-top: 0;
      }

      #peopleList {
        background: #111;

        border-radius: 6px;

        padding: 10px;

        min-height: 40px;

        text-align: left;
      }

      .person {
        padding: 8px;

        border-bottom: 1px solid #444;

        display: flex;

        align-items: center;

        justify-content: space-between;
      }

      .person:last-child {
        border-bottom: none;
      }

      .person-name {
        flex: 1;
      }

      .person-status {
        display: flex;

        align-items: center;

        gap: 4px;
      }

      .status-icon {
        padding: 3px 7px;

        margin: 0;

        font-size: 16px;
      }

      .camera-status {
        cursor: pointer;
      }

      .camera-status.off {
        cursor: default;

        opacity: 0.45;
      }

      .mic-status {
        cursor: default;

        opacity: 0.8;
      }

      /* CHAT */

      #chat {
        width: 500px;

        max-width: 92%;

        margin: 25px auto;

        background: #333;

        border-radius: 12px;

        padding: 15px;
      }

      #chat h2 {
        margin-top: 0;

        text-align: center;
      }

      #messages {
        height: 250px;

        overflow-y: auto;

        background: #111;

        border-radius: 8px;

        padding: 12px;

        margin-bottom: 12px;

        text-align: left;

        display: flex;

        flex-direction: column;

        gap: 8px;
      }

      .chat-message {
        max-width: 80%;

        padding: 8px 12px;

        border-radius: 10px;

        word-wrap: break-word;
      }

      .chat-message.other {
        align-self: flex-start;

        background: #444;
      }

      .chat-message.mine {
        align-self: flex-end;

        background: #555;
      }

      /* CHAT HEADER */

      .message-header {
        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 10px;

        font-size: 12px;

        opacity: 0.75;

        margin-bottom: 4px;
      }

      .message-username {
        font-weight: bold;
      }

      .message-time {
        font-size: 10px;

        opacity: 0.7;

        white-space: nowrap;
      }

      .message-text {
        font-size: 15px;

        line-height: 1.3;
      }

      #chatInputArea {
        display: flex;

        gap: 6px;
      }

      #messageInput {
        flex: 1;

        padding: 11px;

        border: none;

        border-radius: 6px;

        font-size: 14px;
      }

      #messageInput:focus {
        outline: 2px solid #777;
      }

      #sendButton {
        padding: 10px 15px;
      }

      /* USERNAME */

      #usernameArea {
        text-align: center;

        margin: 20px;
      }

      #usernameInput {
        padding: 10px;

        width: 200px;
      }

      /* MOBILE */

      @media (max-width: 700px) {
        #videos {
          grid-template-columns: 1fr;

          padding: 10px;
        }

        .video-container {
          max-width: 100%;
        }

        #chat {
          width: 95%;
        }

        #accountArea {
          width: 95%;
        }

        #loginArea {
          width: 95%;
        }
      }
    </style>
  </head>

  <body>
    <div id="top">
      <h1>Video Chat Room</h1>

      <div id="roomInfo"></div>

      <button id="copyLinkButton">🔗 Copy Room Link</button>
    </div>

    <!-- ACCOUNT -->

    <div id="accountArea">
      <h2>Create Account</h2>

      <input
        id="registerUsernameInput"
        type="text"
        placeholder="Username"
        autocomplete="username"
      />

      <input
        id="registerPasswordInput"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
      />

      <button id="registerButton">Create Account</button>

      <div id="registrationMessage"></div>
    </div>

    <!-- LOGIN -->

    <div id="loginArea">
      <h2>Login</h2>

      <input
        id="loginUsernameInput"
        type="text"
        placeholder="Username"
        autocomplete="username"
      />

      <input
        id="loginPasswordInput"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      />

      <button id="loginButton">Login</button>

      <div id="loginMessage"></div>
    </div>

    <!-- JOIN ROOM -->

    <div id="usernameArea">
      <input id="usernameInput" placeholder="Enter your username" />

      <button id="joinButton">Join Room</button>
    </div>

    <!-- PEOPLE IN ROOM -->

    <div id="peopleBox">
      <h2 id="peopleTitle">People in Room (0)</h2>

      <div id="peopleList"></div>
    </div>

    <!-- VIDEOS -->

    <div id="videos"></div>

    <!-- CONTROLS -->

    <div id="controls">
      <button id="muteButton" disabled>🎤 Mic On</button>

      <button id="cameraButton" disabled>📹 Camera On</button>

      <button id="screenButton" disabled>🖥️ Share Screen</button>

      <button id="leaveButton" disabled>📞 Leave</button>
    </div>

    <!-- CHAT -->

    <div id="chat">
      <h2>💬 Chat</h2>

      <div id="messages"></div>

      <div id="chatInputArea">
        <input
          id="messageInput"
          placeholder="Type a message..."
          autocomplete="off"
        />

        <button id="sendButton">Send</button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="/app.js"></script>
  </body>
</html>
